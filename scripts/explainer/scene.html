<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Buurklus — explainer</title>
    <style>
      /* The font is injected by the renderer as a data URI, so the scene has no
         network dependency and every frame is drawn with the real typeface
         rather than a fallback that shifts the layout halfway through. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        src: url('__FONT__') format('woff2');
      }

      :root {
        --green-900: #06342b;
        --green-700: #0b5546;
        --green-600: #0f6f5c;
        --green-100: #dcefea;
        --green-50: #f1f9f6;
        --saffron: #e2a33c;
        --ink-900: #14201d;
        --ink-500: #5c706b;
        --ink-200: #c7d3cf;
        --ink-100: #e4ebe9;
        --white: #fff;

        /* One knob for the whole composition. The renderer sets it per format,
           so the square and the vertical cut are the same design at two sizes
           rather than two layouts to keep in step. */
        --u: 1px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--white);
        background:
          radial-gradient(120vw 90vh at 82% -18%, var(--green-600) 0%, transparent 62%),
          linear-gradient(158deg, var(--green-900) 0%, var(--green-700) 100%);
        display: grid;
        place-items: center;
        position: relative;
      }

      /* A single quiet mark, well under everything else. */
      .ghost {
        position: absolute;
        right: calc(var(--u) * -120);
        bottom: calc(var(--u) * -160);
        width: calc(var(--u) * 620);
        opacity: 0.06;
        color: var(--white);
      }

      .stage {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        justify-items: center;
        align-items: center;
        padding: calc(var(--u) * 60);
        gap: calc(var(--u) * 24);
      }

      /* --- Shot 1: the hook --- */
      #hook {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: calc(var(--u) * 14);
        padding: calc(var(--u) * 80);
        text-align: center;
      }
      #hookTop {
        font-size: calc(var(--u) * 54);
        font-weight: 600;
        color: var(--green-100);
        line-height: 1.2;
        max-width: 18ch;
      }
      #hookBottom {
        font-size: calc(var(--u) * 96);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      /* --- The step label above the phone --- */
      #step {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 16);
        align-self: end;
      }
      #stepNumber {
        width: calc(var(--u) * 52);
        height: calc(var(--u) * 52);
        border-radius: 50%;
        background: var(--white);
        color: var(--green-700);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: calc(var(--u) * 26);
        flex: none;
      }
      #stepLabel {
        font-size: calc(var(--u) * 34);
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      /* --- The phone --- */
      #phone {
        width: calc(var(--u) * 400);
        background: var(--white);
        border: calc(var(--u) * 12) solid #041f19;
        border-radius: calc(var(--u) * 48);
        padding: calc(var(--u) * 22) calc(var(--u) * 18) calc(var(--u) * 26);
        display: grid;
        gap: calc(var(--u) * 16);
        align-content: start;
        color: var(--ink-900);
        box-shadow: 0 calc(var(--u) * 40) calc(var(--u) * 80) rgba(0, 0, 0, 0.4);
        position: relative;
      }
      #notch {
        width: 34%;
        height: calc(var(--u) * 7);
        border-radius: calc(var(--u) * 4);
        background: var(--ink-100);
        justify-self: center;
      }

      .screen {
        display: grid;
        gap: calc(var(--u) * 14);
        grid-row: 3;
        grid-column: 1;
      }

      /* --- The job card, on both screens --- */
      #job {
        background: var(--green-50);
        border: 1px solid var(--green-100);
        border-radius: calc(var(--u) * 18);
        padding: calc(var(--u) * 18) calc(var(--u) * 18);
        display: grid;
        gap: calc(var(--u) * 6);
      }
      #jobTitle {
        font-weight: 700;
        font-size: calc(var(--u) * 21);
        line-height: 1.25;
        color: var(--green-900);
      }
      #jobMeta {
        font-size: calc(var(--u) * 17);
        color: var(--green-700);
      }

      /* --- Screen one: describing the job --- */
      #typedBox {
        border: 1px solid var(--ink-100);
        border-radius: calc(var(--u) * 16);
        padding: calc(var(--u) * 16);
        min-height: calc(var(--u) * 108);
        font-size: calc(var(--u) * 18);
        line-height: 1.45;
        color: var(--ink-900);
      }
      #caret {
        display: inline-block;
        width: calc(var(--u) * 2);
        height: calc(var(--u) * 20);
        background: var(--green-600);
        vertical-align: text-bottom;
        margin-left: calc(var(--u) * 2);
      }
      #fields {
        display: grid;
        gap: calc(var(--u) * 10);
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: calc(var(--u) * 12);
        border: 1px solid var(--ink-100);
        border-radius: calc(var(--u) * 14);
        padding: calc(var(--u) * 13) calc(var(--u) * 16);
        opacity: 0;
      }
      .field__label {
        font-size: calc(var(--u) * 17);
        color: var(--ink-500);
      }
      .field__value {
        font-size: calc(var(--u) * 18);
        font-weight: 600;
      }

      /* --- Screen two: the quotes --- */
      #quotes {
        display: grid;
        gap: calc(var(--u) * 12);
      }
      .quote {
        border: 1px solid var(--ink-100);
        border-radius: calc(var(--u) * 16);
        padding: calc(var(--u) * 15) calc(var(--u) * 16);
        display: grid;
        gap: calc(var(--u) * 8);
        opacity: 0;
        position: relative;
        background: var(--white);
        transition: none;
      }
      .quote__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: calc(var(--u) * 10);
      }
      .quote__name {
        font-weight: 600;
        font-size: calc(var(--u) * 19);
        line-height: 1.25;
      }
      .quote__price {
        font-weight: 800;
        font-size: calc(var(--u) * 21);
        color: var(--green-700);
        white-space: nowrap;
      }
      .quote__meta {
        font-size: calc(var(--u) * 16);
        color: var(--ink-500);
        margin-left: auto;
      }
      .stars {
        font-size: calc(var(--u) * 17);
        letter-spacing: 0.06em;
      }
      .stars .on {
        color: var(--saffron);
      }
      .stars .off {
        color: var(--ink-200);
      }
      .quote__chosen {
        position: absolute;
        top: calc(var(--u) * -12);
        right: calc(var(--u) * 14);
        background: var(--green-600);
        color: var(--white);
        font-size: calc(var(--u) * 14);
        font-weight: 700;
        padding: calc(var(--u) * 4) calc(var(--u) * 12);
        border-radius: 999px;
        opacity: 0;
      }
      /* The dimming and the highlight are plain state classes, switched by the
         scene rather than tweened, so a frame is never caught mid-transition. */
      .quote--dimmed {
        opacity: 0.42 !important;
      }
      .quote--chosen {
        border-color: var(--green-600);
        border-width: 2px;
        box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 24) rgba(15, 111, 92, 0.22);
      }
      .quote--chosen .quote__chosen {
        opacity: 1;
      }
      #quotesCount {
        font-size: calc(var(--u) * 16);
        color: var(--ink-500);
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 8);
      }
      #quotesCount::before {
        content: '';
        width: calc(var(--u) * 9);
        height: calc(var(--u) * 9);
        border-radius: 50%;
        background: var(--green-600);
      }

      /* The fingertip. */
      #tap {
        position: absolute;
        left: 50%;
        bottom: calc(var(--u) * 74);
        width: calc(var(--u) * 76);
        height: calc(var(--u) * 76);
        margin-left: calc(var(--u) * -38);
        border-radius: 50%;
        background: rgba(15, 111, 92, 0.24);
        border: calc(var(--u) * 3) solid rgba(15, 111, 92, 0.55);
        opacity: 0;
        pointer-events: none;
      }

      /* --- The caption under the phone --- */
      #caption {
        align-self: start;
        font-size: calc(var(--u) * 30);
        color: var(--green-100);
        text-align: center;
        max-width: 24ch;
        line-height: 1.35;
      }

      /* --- Shot 5: the privacy line --- */
      #privacy {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: calc(var(--u) * 16);
        padding: calc(var(--u) * 90);
        text-align: center;
      }
      #privacyMark {
        width: calc(var(--u) * 86);
        height: calc(var(--u) * 86);
        border-radius: calc(var(--u) * 26);
        background: rgba(220, 239, 234, 0.14);
        border: 1px solid rgba(220, 239, 234, 0.3);
        color: var(--green-100);
        display: grid;
        place-items: center;
        margin-bottom: calc(var(--u) * 6);
      }
      #privacyTitle {
        font-size: calc(var(--u) * 52);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #privacyBody {
        font-size: calc(var(--u) * 30);
        line-height: 1.45;
        color: var(--green-100);
        max-width: 26ch;
      }

      /* --- Shot 6: the end card --- */
      #end {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: calc(var(--u) * 22);
        padding: calc(var(--u) * 80);
        text-align: center;
        background:
          radial-gradient(100vw 80vh at 50% 40%, rgba(15, 111, 92, 0.5) 0%, transparent 62%),
          linear-gradient(158deg, var(--green-900) 0%, var(--green-700) 100%);
      }
      #endMark {
        width: calc(var(--u) * 108);
        height: calc(var(--u) * 108);
        border-radius: calc(var(--u) * 30);
        background: var(--white);
        color: var(--green-700);
        display: grid;
        place-items: center;
      }
      #endMark svg { width: calc(var(--u) * 56); height: calc(var(--u) * 56); }
      #privacyMark svg { width: calc(var(--u) * 40); height: calc(var(--u) * 40); }
      #endTitle {
        font-size: calc(var(--u) * 62);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.08;
        max-width: 16ch;
      }
      #endMeta {
        font-size: calc(var(--u) * 28);
        color: var(--green-100);
      }
      #endUrl {
        font-size: calc(var(--u) * 40);
        font-weight: 800;
        letter-spacing: -0.01em;
        padding: calc(var(--u) * 14) calc(var(--u) * 34);
        border-radius: 999px;
        background: var(--white);
        color: var(--green-700);
      }
    </style>
  </head>
  <body>
    <svg class="ghost" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="m14 6 4 4M3 21l7-7M12.5 4.5 19 11l2-2-6.5-6.5-2 2ZM10.5 9.5 5 15l4 4 5.5-5.5" />
    </svg>

    <div class="stage">
      <div id="step" style="opacity: 0">
        <span id="stepNumber">1</span>
        <span id="stepLabel"></span>
      </div>

      <div id="phone" style="opacity: 0">
        <span id="notch"></span>

        <div id="job">
          <span id="jobTitle"></span>
          <span id="jobMeta"></span>
        </div>

        <div class="screen" id="screenForm">
          <div id="typedBox"><span id="typed"></span><span id="caret"></span></div>
          <div id="fields"></div>
        </div>

        <div class="screen" id="screenQuotes" style="opacity: 0">
          <div id="quotes"></div>
          <span id="quotesCount"></span>
        </div>

        <span id="tap"></span>
      </div>

      <p id="caption" style="opacity: 0"></p>
    </div>

    <div id="hook" style="opacity: 0">
      <span id="hookTop"></span>
      <span id="hookBottom"></span>
    </div>

    <div id="privacy" style="opacity: 0">
      <span id="privacyMark">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6l-8-3Zm-1.2 12L8 12.2l1.4-1.4 1.4 1.4 3.8-3.8L16 9.8 10.8 15Z" />
        </svg>
      </span>
      <span id="privacyTitle"></span>
      <span id="privacyBody"></span>
    </div>

    <div id="end" style="opacity: 0">
      <span id="endMark">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14 6 4 4M3 21l7-7M12.5 4.5 19 11l2-2-6.5-6.5-2 2ZM10.5 9.5 5 15l4 4 5.5-5.5" />
        </svg>
      </span>
      <span id="endTitle"></span>
      <span id="endMeta"></span>
      <span id="endUrl"></span>
    </div>

    <script src="scene.js"></script>
  </body>
</html>
