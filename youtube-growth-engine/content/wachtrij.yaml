# De afleveringenwachtrij. Dit is wat "geautomatiseerd" in dit project betekent:
# de machine pakt het volgende onderwerp en maakt de video af tot het punt waar
# een mens moet kijken. Verder komt hij niet, en dat is opzet — zie docs/20.
#
# status:
#   gepland              nog niet aangeraakt; hier pakt --volgende uit
#   in-productie         draait nu (blijft zo staan als er iets crasht)
#   wacht-op-goedkeuring klaar; reviewer en jij moeten tekenen
#   gepubliceerd         staat online (zet je zelf, na openbaar maken in Studio)
#   afgeblazen           gaat niet door; met een reden erbij
#
# Volgorde in dit bestand is de volgorde van produceren. Wil je iets naar
# voren halen, verplaats het dan gewoon naar boven.

