# Wat dit kanaal niet doet. Komt bovenop de vaste regels uit docs/12 en kan
# alleen verbieden, nooit toestaan.
#
# Deze lijst geldt ONGEACHT het onderwerp en blijft staan na de nichewissel:
# hij ging over wat wel en niet mag, niet over waar de video's over gaan.

boundaries:
  - avoid: "naaktheid, onthullende kleding, of beeld dat op verleiding speelt"
    why: "islamitisch niet verantwoord, en het is ook niet nodig om te boeien"
  - avoid: "schelden, grof taalgebruik, beledigingen"
    why: "zelfde norm, en het kost adverteerders"
  - avoid: "alcohol, gokken, rente-producten als iets aantrekkelijks tonen"
    why: "wordt in beeld of woord makkelijk normaliserend"
  - avoid: "muziek met melodische instrumenten als dat niet uitdrukkelijk is aangezet"
    why: "zie music_policy in config/defaults.yaml"
  - avoid: "roddel, bloot op de thumbnail, of spanning die op schaamte leunt"
    why: "kortetermijnklikken tegen langetermijnvertrouwen"
  - avoid: "mensen belachelijk maken of afrekenen"
    why: "past niet bij een kanaal dat gezinnen samen kijken"
  - avoid: "voor-en-na-beelden van lichamen, of beeld dat op schaamte over het lichaam speelt"
    why: "gezondheidsniche, en het botst met de contentnorm hierboven"
  - avoid: "wondermiddelen, detox, of iets dat als genezing wordt gepresenteerd"
    why: "medische misinformatie, en het kost je het kanaal"
  - avoid: "woordelijk citeren uit een Nederlandse Koranvertaling zonder aantoonbare toestemming"
    why: >
      De Arabische tekst is vrij, een vertaling is een zelfstandig werk en blijft
      beschermd tot zeventig jaar na het overlijden van de vertaler. Gratis te
      lezen op een website is geen licentie. De vaste lijn is daarom: de
      gebeurtenis vertellen en de vindplaats noemen, niet de vertaling
      naspreken. Komt er schriftelijke toestemming, dan mag citeren wel — zet de
      uitgave en de vindplaats van die toestemming in config/defaults.yaml.
      Zie docs/19.
