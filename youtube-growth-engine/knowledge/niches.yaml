# Zes kanaalvoorstellen, door mij gekozen op wat past bij wat je hebt:
# Nederlands, faceless, EUR 100 per maand, 1 video per week, en een contentnorm
# die naaktheid, alcohol en gokken uitsluit.
#
# Vier eisen heb ik op alles losgelaten:
#   1. Beeld moet met grafieken en illustratie kunnen — geen opnames op locatie,
#      geen beeld van bestaande merken of producten.
#   2. Bronnen moeten gratis, Nederlandstalig en gezaghebbend zijn.
#   3. Minstens vijftig video's zonder in herhaling te vallen.
#   4. Geen niche waar geautomatiseerde kanalen worden beëindigd.

# Categorie 2 telt weer mee. Bij deze niche is dat het verschil: de voorsprong
# is er echt en hij is niet te kopiëren. Weglaten onderdrukt precies het stuk
# dat deze keuze sterk maakt.
#
# Wil je hem er weer uit: zet `excludeCategories: [creator_advantage]` terug.
scoring: {}

candidates:
  - key: hoe-nederland-werkt
    proposition: >
      Hoe de infrastructuur van Nederland werkelijk werkt — water, stroom,
      spoor, data — uitgelegd met de cijfers van de beheerders zelf
    usesAdvantage: true
    scores:
      audience_demand: 13
      creator_advantage: 12
      original_positioning: 13
      evergreen: 10
      scalability: 10
      title_thumbnail: 9
      competition: 8
      production_feasibility: 5
      credibility: 5
      monetisation: 4
    notes: >
      De sterkste die ik kan bedenken voor jouw situatie. Rijkswaterstaat,
      TenneT, ProRail, CBS en de waterschappen publiceren alles gratis en
      gedetailleerd, en vrijwel niemand gebruikt het. Diagrammen zijn hier geen
      noodoplossing maar de beste vorm, dus het beeld is spotgoedkoop. Nul
      beleidsrisico, nul auteursrechtrisico, en het onderwerp raakt nooit op:
      sluizen, hoogspanning, het spoorwegnet, zeekabels, drinkwater, dijken,
      gemalen, het frequentiespectrum. Zwakke plek is de advertentiewaarde —
      dit is geen premiumcategorie.

  - key: verborgen-kosten
    proposition: >
      Wat Nederlandse huishoudens betalen zonder het te weten — abonnementen,
      energiecontracten, verzekeringen — nagerekend met openbare cijfers
    usesAdvantage: true
    scores:
      audience_demand: 14
      creator_advantage: 11
      original_positioning: 12
      evergreen: 9
      scalability: 9
      title_thumbnail: 10
      competition: 7
      production_feasibility: 5
      credibility: 4
      monetisation: 5
    notes: >
      Hoogste vraag van de zes en uitstekende titel- en thumbnailpotentie: een
      bedrag in beeld werkt altijd. Bronnen zijn gratis (ACM, CBS, Nibud,
      Consumentenbond) en het is consumenteninformatie, geen financieel advies —
      dat scheelt de zware drempel die persoonlijke financiën wel heeft. Let op:
      blijf bij nagerekende kosten en ga niet adviseren over sparen of
      beleggen, want dan kom je alsnog in het gevoelige regime.

  - key: kantoorwerk-lichaam
    proposition: >
      Wat acht uur zitten met je lichaam doet, uitgelegd met Nederlandse
      arbo-cijfers en onderzoek, voor kantoorwerkers van dertig tot vijftig
    usesAdvantage: true
    scores:
      audience_demand: 12
      creator_advantage: 11
      original_positioning: 12
      evergreen: 10
      scalability: 8
      title_thumbnail: 8
      competition: 7
      production_feasibility: 5
      credibility: 4
      monetisation: 5
    notes: >
      De niche waar video 002 al voor geschreven is. Goede adverteerders
      (bureaustoelen, arbodiensten, verzekeraars) en het is arbo en geen
      medisch advies, dus de drempel is haalbaar. Schaalbaarheid is de zwakste
      van de top drie: na dertig video's over zitten, schermen en houding moet
      je verbreden.

  - key: slaap-nl
    proposition: >
      Slaap uitgelegd met wat er werkelijk in het onderzoek staat, voor
      Nederlanders die slecht slapen en alles al geprobeerd hebben
    usesAdvantage: true
    scores:
      audience_demand: 14
      creator_advantage: 11
      original_positioning: 9
      evergreen: 10
      scalability: 7
      title_thumbnail: 8
      competition: 4
      production_feasibility: 5
      credibility: 3
      monetisation: 5
    notes: >
      Enorme vraag en perfect evergreen, maar het drukste deel van de
      gezondheidshoek: er zijn al veel kanalen, waarvan sommige met artsen. En
      het raakt sneller aan medisch advies dan arbo doet, dus de drempel van 95
      bijt hier harder. Als tweede kanaal sterk, als eerste te zwaar.

  - key: hoe-games-geld-verdienen
    proposition: >
      Hoe de game-industrie werkelijk geld verdient — battle passes, loot,
      prijsstelling — uitgelegd met eigen diagrammen en openbare jaarcijfers
    usesAdvantage: false
    scores:
      audience_demand: 13
      creator_advantage: 9
      original_positioning: 11
      evergreen: 8
      scalability: 8
      title_thumbnail: 9
      competition: 5
      production_feasibility: 4
      credibility: 4
      monetisation: 3
    notes: >
      De enige vorm van gaming die ik kan verantwoorden: geen gameplaybeelden,
      alleen eigen diagrammen en jaarverslagen van beursgenoteerde uitgevers.
      Daarmee vervalt het auteursrechtprobleem. Blijft over: de lage RPM van de
      gamingcategorie, en merknamen in beeld blijven opletten. Als je gaming
      wilt, is dit de manier. Maar het is niet de beste keuze.

  - key: ai-op-je-werk
    proposition: >
      Wat AI op een Nederlandse werkvloer wel en niet kan, elke week één
      nagerekend voorbeeld
    usesAdvantage: false
    scores:
