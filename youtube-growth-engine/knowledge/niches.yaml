# Kandidaten binnen gezondheid, AI en gaming.
#
# "Gezondheid" is geen propositie maar een onderwerp — de focustoets wijst dat
# af. Elke regel hieronder is daarom een toegespitst kanaalvoorstel.
#
# De scores zijn mijn redactionele oordeel. De CODE rekent en begrenst:
#   - voorsprong die deze niche niet gebruikt  -> categorie 2 wordt 5 van de 15
#   - minder dan drie voorsprongen             -> categorie 2 maximaal 11
#   - geen actuele externe data                -> vraag en concurrentie geplafonneerd

candidates:
  - key: gezondheid-nl-bronnen
    proposition: >
      Nederlandse gezondheidsuitleg die per bewering laat zien wat het RIVM,
      het Voedingscentrum of een systematische review er werkelijk over zegt
    usesAdvantage: true
    scores:
      audience_demand: 14
      creator_advantage: 11
      original_positioning: 11
      evergreen: 10
      scalability: 10
      title_thumbnail: 9
      competition: 6
      production_feasibility: 4
      credibility: 3
      monetisation: 5
    notes: >
      Je taal telt hier wél als voorsprong: het Nederlandse veld is dun en de
      primaire bronnen zijn gratis, Nederlandstalig en gezaghebbend. Evergreen,
      goedkoop in beeld (grafieken), en de invalshoek "wat staat er echt in de
      bron" is een positie die niemand anders inneemt. Zwakke plek is
      geloofwaardigheid: gezondheid is een gevoelig onderwerp, dus de
      bronnendrempel gaat naar 95 en volautomatisch publiceren blijft uit.

  - key: gezondheid-en-generiek
    proposition: >
      Engelstalige gezondheidsvideo's over slaap, voeding en beweging voor een
      breed publiek
    usesAdvantage: false
    scores:
      audience_demand: 15
      creator_advantage: 12
      original_positioning: 6
      evergreen: 10
      scalability: 10
      title_thumbnail: 9
      competition: 2
      production_feasibility: 4
      credibility: 3
      monetisation: 5
    notes: >
      De grootste markt en de hoogste advertentiewaarde van alle vijf. En het
      drukste veld dat er bestaat, met kanalen die artsen in dienst hebben.
      Zonder voorsprong sta je daar met lege handen.

  - key: ai-voor-mkb
    proposition: >
      AI-automatisering voor kleine Nederlandse bedrijven, elke week één
      werkend voorbeeld
    usesAdvantage: false
    scores:
      audience_demand: 14
      creator_advantage: 10
      original_positioning: 6
      evergreen: 5
      scalability: 8
      title_thumbnail: 7
      competition: 2
      production_feasibility: 4
      credibility: 2
      monetisation: 5
    notes: >
      Hoge RPM, en de slechtste keuze voor een geautomatiseerd kanaal. Dit is de
      niche waar YouTube in januari 2026 zestien kanalen beëindigde wegens
      massaal geproduceerde content. Veroudert binnen maanden, dus evergreen is
      er niet bij, en de bronbasis is grotendeels sociale media.

  - key: gaming-faceless
    proposition: >
      Faceless gamingkanaal met uitleg, ranglijsten en verhalen uit bekende
      games
    usesAdvantage: false
    scores:
      audience_demand: 14
      creator_advantage: 8
      original_positioning: 5
      evergreen: 4
      scalability: 9
      title_thumbnail: 9
      competition: 2
      production_feasibility: 2
      credibility: 4
      monetisation: 2
    notes: >
      Twee harde problemen. Gaming heeft de laagste RPM van alle grote niches —
      je hebt vijf tot tien keer zoveel views nodig voor hetzelfde bedrag. En
      faceless gaming draait op gameplaybeelden, en die zijn van iemand anders:
      dat botst frontaal met de auteursrechtregel dat er geen bestand van een
      andere maker het systeem in komt. Eigen beeld genereren van bestaande
      games kan niet zonder de merkrechten te raken.

  - key: gezondheid-nl-werkplek
    proposition: >
      Wat acht uur zitten met je lichaam doet, uitgelegd met Nederlandse
      arbo-cijfers en onderzoek, voor kantoorwerkers van dertig tot vijftig
    usesAdvantage: true
    scores:
      audience_demand: 12
      creator_advantage: 11
      original_positioning: 12
      evergreen: 10
      scalability: 8
      title_thumbnail: 8
      competition: 7
      production_feasibility: 5
      credibility: 4
      monetisation: 5
    notes: >
      Smaller dan algemene gezondheid, en daardoor sterker: een scherp
      afgebakend publiek, Nederlandse cijfers die niemand gebruikt, en het is
      geen medisch advies maar arbeidsomstandigheden — waardoor de
      geloofwaardigheidsdrempel haalbaar blijft. Adverteerders in deze hoek
      (bureaustoelen, arbodiensten, verzekeraars) betalen goed.
