# Vastgelegde keuzes. `source: user` = door jou beantwoord, `source: default` =
# door mij ingevuld met de aanbevolen standaard. Wijzig hier, niet in code.

project:
  name: "YouTube Growth Engine"
  standalone: true            # source: user (vraag 10) — los van Buurklus
  repo_path: youtube-growth-engine

niche:
  source: user                # vraag 2
  label: "Islamitische content voor gezinnen, jongeren en kinderen"
  pillars:
    - arabisch_leren
    - islamitische_verhalen_en_waarden
    - ramadan_en_bijzondere_momenten
    - eid_al_fitr_en_eid_al_adha
    - nasheeds_reminders_animaties_quizzen
    - islamitische_geschiedenis_personen_plaatsen
  creator_expertise: "affiniteit en publieksinzicht; geen islamitisch geleerde"
  # Gevolg: elke religieuze claim door de religieuze integriteitspoort (docs/12)
  # en door een gekwalificeerde menselijke reviewer. Niet automatiseerbaar.

audience:
  source: default             # ZIE docs/11 §2 — dit is de duurste keuze van allemaal
  primary: "gezinnen en jongeren (13+), kind kijkt mee met ouder"
  made_for_kids: false
  # LET OP: 'made for kids' verlaagt de RPM structureel naar $1-3 en schakelt
  # reacties, eindschermen, kaarten en lidmaatschappen uit. De aanbeveling is
  # daarom: maak het werkelijk voor gezinnen, niet voor kleuters. Een
  # kinderkanaal is een aparte, latere beslissing met een eigen kanaal.

languages:
  source: user                # vraag 3
  primary: nl
  roadmap: [nl, de, en]
  strategy: revoice           # zelfde beeld, nieuwe voice-over + ondertiteling
  # Zie docs/11 §4: hervoicen kost ~35% van een nieuwe video en is de goedkoopste
  # groeihefboom die je hebt.

format:
  source: user                # vraag 4, 5
  long_form:
    enabled: true
    min_duration_s: 600
    target_duration_s: 660
    aspect: "16:9"
  shorts:
    enabled: true
    target_duration_s: 45
    aspect: "9:16"

cadence:
  source: default             # ZIE docs/11 §3 — jouw vraag 6 was 2 long-form/week
  requested_by_user:
    long_form_per_week: 2
    shorts_per_week: 1
  recommended:
    long_form_per_week: 1
    languages_per_video: 2    # nl + de
    shorts_per_week: 1
  max_publications_per_day: 1
  pilot_video_count: 10
  # Reden voor de afwijking: 2 long-form/week van 10+ minuten past niet in
  # EUR 100/maand zonder de kwaliteit te verlagen tot precies het profiel dat
  # het inauthentic-content-beleid beschrijft. Zie docs/11 §3 voor de som.

budget:
  source: user                # vraag 7
  monthly_eur: 100
  hard_cap_monthly_eur: 100
  hard_cap_daily_eur: 8
  hard_cap_per_production_eur: 18
  # Bij overschrijding pauzeert de wachtrij. Geen stille doorbelasting.

presentation:
  source: default             # vraag 8 — jij liet de keuze aan mij
  narrator: "synthetische voice-over, warm en rustig, geen presentator in beeld"
  visual_style: "gestileerde 2D-illustratie, cinematisch, geen kleutercartoon"
  animation_method: limited_animation
  # Beperkte animatie (vaste karakterbladen + compositing) in plaats van
  # generatieve videoclips. Goedkoper EN consistenter. Zie docs/11 §5.
  music_policy: vocals_and_duff_only
  # Nasheed-conventie: geen instrumentale bedden tenzij jij dat wijzigt.
  no_ai_face: true
  no_voice_cloning: true

revenue:
  source: default             # vraag 9 — jij beantwoordde daar de socials-vraag
  priority:
    - eigen_product_of_dienst
    - affiliate
    - sponsoring
    - advertenties
  # Nog te bevestigen. Zie docs/11 §7 voor de openstaande vraag.

social_distribution:
  source: user                # vraag 9
  requested: [instagram, facebook, tiktok, x]
  status: planned_m7
  account_creation_by_claude: false
  # Ik maak geen accounts aan en sluit geen abonnementen af. Zie docs/11 §7.

gates:
  editorial_quality: 85
  retention_readiness: 80
  originality: 90
  source_confidence: 90
  source_confidence_sensitive: 95
  trust: 90
  policy_risk_max: low
  religious_integrity: blocking    # nieuw, zie docs/12

modes:
  approval_mode: true
  auto_publish_sensitive: false    # permanent, niet instelbaar
