# Vastgelegde keuzes. `source: user` = door jou beantwoord, `source: default` =
# door mij ingevuld met de aanbevolen standaard. Wijzig hier, niet in code.

project:
  name: "YouTube Growth Engine"
  standalone: true            # source: user (vraag 10) — los van Buurklus
  repo_path: youtube-growth-engine

channel:
  source: user
  handle: "@Dailyislamicreminders2026"
  # PAST NIET MEER BIJ DE NICHE. Naam, handle en het publiek dat zich al
  # abonneerde horen bij islamitische content. Gezondheid vraagt een nieuw
  # kanaal. Nog niets gepubliceerd, dus dat kost niets — maar het moet vóór de
  # eerste upload gebeuren.
  status: "te vervangen"
  url: "https://www.youtube.com/@Dailyislamicreminders2026"
  # LET OP — twee dingen om over te beslissen:
  # 1. "Daily" belooft dagelijks. Het plan is 1 long-form per week plus 1 Short.
  #    Dat is geen probleem voor de kijker, wel voor de verwachting die de naam
  #    schept. Overweeg een naam zonder frequentie erin.
  # 2. "2026" veroudert over een jaar en staat in je handle, dus in elke link.
  # Beide zijn nu makkelijk te wijzigen en over honderd video's niet meer.

niche:
  source: user                # gewijzigd: geen islamitische onderwerpen meer
  label: "Kantoorwerk en gezondheid, met Nederlandse cijfers"
  proposition: >
    Wat acht uur zitten met je lichaam doet, uitgelegd met Nederlandse
    arbo-cijfers en onderzoek, voor kantoorwerkers van dertig tot vijftig
  score: 81                   # npm run niches
  claim_profile: medisch      # zie docs/16 — drempel 95, vier eisen per studie
  # Eerdere kandidaten en hun score staan in knowledge/niches.yaml.
  # AI (55) en gaming (53) stonden onderaan van de vijf.

vorige_niche:
  label: "Islamitische content voor gezinnen"
  oude_pillars:
    - arabisch_leren
    - islamitische_verhalen_en_waarden
    - ramadan_en_bijzondere_momenten
    - eid_al_fitr_en_eid_al_adha
    - nasheeds_reminders_animaties_quizzen
    - islamitische_geschiedenis_personen_plaatsen
  creator_expertise: "affiniteit en publieksinzicht; geen islamitisch geleerde"
  # Gevolg: elke religieuze claim door de religieuze integriteitspoort (docs/12)
  # en door een gekwalificeerde menselijke reviewer. Niet automatiseerbaar.

audience:
  source: default             # ZIE docs/11 §2 — dit is de duurste keuze van allemaal
  primary: "gezinnen en jongeren (13+), kind kijkt mee met ouder"
  made_for_kids: false
  # LET OP: 'made for kids' verlaagt de RPM structureel naar $1-3 en schakelt
  # reacties, eindschermen, kaarten en lidmaatschappen uit. De aanbeveling is
  # daarom: maak het werkelijk voor gezinnen, niet voor kleuters. Een
  # kinderkanaal is een aparte, latere beslissing met een eigen kanaal.

languages:
  source: user                # vraag 3
  primary: nl
  roadmap: [nl, de, en]
  strategy: revoice           # zelfde beeld, nieuwe voice-over + ondertiteling
  # Zie docs/11 §4: hervoicen kost ~35% van een nieuwe video en is de goedkoopste
  # groeihefboom die je hebt.

format:
  source: user                # vraag 4, 5
  long_form:
    enabled: true
    min_duration_s: 600
    target_duration_s: 660
    aspect: "16:9"
  shorts:
    enabled: true
    target_duration_s: 45
    aspect: "9:16"

cadence:
  source: user                # akkoord gegeven op 1 long-form per week
  long_form_per_week: 1
  shorts_per_week: 1
  languages_per_video: 1      # nl tijdens de pilot; de erbij vanaf video 11
  max_publications_per_day: 1
  pilot_video_count: 10
  # Reden voor de afwijking: 2 long-form/week van 10+ minuten past niet in
  # EUR 100/maand zonder de kwaliteit te verlagen tot precies het profiel dat
  # het inauthentic-content-beleid beschrijft. Zie docs/11 §3 voor de som.

budget:
  source: user                # vraag 7
  monthly_eur: 100
  hard_cap_monthly_eur: 100
  hard_cap_daily_eur: 8
  hard_cap_per_production_eur: 18
  # Bij overschrijding pauzeert de wachtrij. Geen stille doorbelasting.

presentation:
  source: default             # vraag 8 — jij liet de keuze aan mij
  narrator: "synthetische voice-over, warm en rustig, geen presentator in beeld"
  visual_style: "gestileerde 2D-illustratie, cinematisch, geen kleutercartoon"
  animation_method: limited_animation
  # Beperkte animatie (vaste karakterbladen + compositing) in plaats van
  # generatieve videoclips. Goedkoper EN consistenter. Zie docs/11 §5.
  music_policy: vocals_and_duff_only
  # Nasheed-conventie: geen instrumentale bedden tenzij jij dat wijzigt.
  no_ai_face: true
  no_voice_cloning: true

revenue:
  source: user                # "AdSense, ebooks, en verder improviseren"
  priority:                   # gerangschikt op opbrengst per uur werk, zie docs/13
    - ebooks_en_werkboeken    # al gebouwd: EUR 0,04 extra per hoofdstuk
    - affiliate
    - lidmaatschappen         # vanaf drempel 1: 500 abonnees + 3.000 kijkuren
    - youtube_shopping        # zelfde drempel; verkoopt de werkboeken onder de video
    - advertenties            # vanaf drempel 2: 1.000 abonnees + 4.000 kijkuren
    - sponsoring
  # De twee YPP-drempels staan in docs/13 §1. Drempel 1 ligt 40% dichterbij dan
  # drempel 2 en opent Shopping — dat is de route, niet AdSense.
  seasonal_peak: ramadan      # publiekspiek en koopkrachtpiek vallen samen

religious:
  source: user
  # VERPLICHT INVULLEN vóór de eerste echte productie. Zie docs/HANDLEIDING.md
  # stap 6: de meeste Nederlandse Koranvertalingen zijn auteursrechtelijk
  # beschermd werk, en "het is de Koran" dekt de vertaling niet.
  quran_translation: "NOG TE KIEZEN"
  quran_translation_licence: ""
  # De gekwalificeerde reviewer. Niet automatiseerbaar; zie docs/12 §5.
  reviewer_name: ""
  reviewer_fee_eur_per_video: 20
  # Arabische tekst komt nooit uit een model. Id's uit de geverifieerde
  # bibliotheek, met per item de mens die hem controleerde.
  verified_arabic_asset_ids: []

references:
  source: user
  channels:
    - "youtube.com/@MrBeast"        # alleen tempo en inzet-leesbaarheid
    - "youtube.com/@IShowSpeed"     # alleen tempo; format is niet overdraagbaar
  # Titels van referentievideo's mogen als invoer mee. Ze staan in quarantaine:
  # het model ziet alleen de VORM (getal, ontkenning, vraag, lengte), nooit de
  # tekst, en de gepubliceerde titel wordt tegen elke seed gemeten. Zie docs/13.
  seed_titles: []
  # Nog aan te leveren: de titels achter 8dQ3lizkjuE, -1stLOoDxb0, znyI0p4L-F0
  # en kanaal UC5vfWTTPnKdFp-8s0KbqJhw. Die kon ik niet ophalen.
  reuse_mode: "A"             # zie docs/14: A = klassiek bronmateriaal opnieuw
                              # vertellen. Bevestig of dit klopt.

social_distribution:
  source: user                # vraag 9
  requested: [instagram, facebook, tiktok, x]
  status: planned_m7
  account_creation_by_claude: false
  # Ik maak geen accounts aan en sluit geen abonnementen af. Zie docs/11 §7.

gates:
  editorial_quality: 85
  retention_readiness: 80
  originality: 90
  source_confidence: 90
  source_confidence_sensitive: 95
  trust: 90
  policy_risk_max: low
  religious_integrity: blocking    # nieuw, zie docs/12

modes:
  approval_mode: true
  auto_publish_sensitive: false    # permanent, niet instelbaar
