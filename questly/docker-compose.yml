# Local PostgreSQL for development. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: questly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: questly
      POSTGRES_PASSWORD: questly
      POSTGRES_DB: questly
    ports:
      - '5432:5432'
    volumes:
      - questly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U questly -d questly']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  questly-pgdata:
