name: Bladi

on:
  push:
    branches: ['**']
    paths: ['bladi/**', '.github/workflows/bladi.yml']
  pull_request:
    paths: ['bladi/**', '.github/workflows/bladi.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gedmma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bladi/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
