name: Gedmma

on:
  push:
    branches: ['**']
    paths: ['gedmma/**', '.github/workflows/gedmma.yml']
  pull_request:
    paths: ['gedmma/**', '.github/workflows/gedmma.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gedmma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gedmma/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
