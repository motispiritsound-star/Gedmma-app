name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khidma
          POSTGRES_PASSWORD: khidma
          POSTGRES_DB: khidma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khidma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://khidma:khidma@localhost:5432/khidma_test?schema=public
      TEST_DATABASE_URL: postgresql://khidma:khidma@localhost:5432/khidma_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-0000000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate --workspace @khidma/api

      - name: Build the shared package
        run: npm run build --workspace @khidma/shared

      - name: Build the website
        run: npm run build --workspace @khidma/web

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
