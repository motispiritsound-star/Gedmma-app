name = "darijaforkids-post"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Where the app posts to and where the links in the mails point. Set this to
# the worker's own address once it is deployed.
[vars]
BASIS = "https://post.darijaforkids.eu"
AFZENDER_NAAM = "Darijaforkids"
AFZENDER_EMAIL = "post@darijaforkids.eu"
# Waar de lezer staat; de sleutel komt achter het hekje en gaat nooit naar een server.
LEZER = "https://darijaforkids.eu/lezen"
# De website zelf. Het portaal woont daar, en het koekje wordt op dit domein
# gezet — niet op dat van deze worker, want de bladzijde vraagt hem op.
SITE = "https://darijaforkids.eu"

# De database. Eén keer gemaakt met `npm run maak-db`, en het id dat die
# opdracht afdrukt staat hieronder.
#
# Het mag in de repo staan: een database-id is een naam en geen sleutel. Wie
# hem heeft kan er niets mee zonder de toegang tot het account, en de enige
# manier om hem geheim te houden zou zijn dat iedereen die dit uitrolt hem met
# de hand overtypt — precies de stap die mensen vergeten.
#
# Let op: `wrangler d1 create` stelt ook een `binding` voor met de naam van de
# database. Die niet overnemen. De code zoekt `env.DB`, en met een andere
# binding start de worker wel maar valt hij om bij het eerste verzoek.
[[d1_databases]]
binding = "DB"
database_name = "darijaforkids"
database_id = "efdc2224-da27-45cf-974c-36ba1fd95fc0"

# One run a week. Monday morning, because a week that is reported on Monday is
# a week somebody can still do something about.
[triggers]
crons = ["0 7 * * 1"]

# Two secrets, never in this file:
#   npx wrangler secret put MAIL_SLEUTEL
#   npx wrangler secret put ZOUT

# De bladzijden van de boeken, één object per bladzijde:
#   <reeks>/<deel>/<taal>/<nummer>.webp
# Maak de bak één keer aan met:
#   npx wrangler r2 bucket create darijaforkids-boeken
# en vul hem met `npm run bladen -- --uploaden`.
[[r2_buckets]]
binding = "BOEKEN"
bucket_name = "darijaforkids-boeken"

# Waar de lezer staat. De sleutel komt achter het hekje en gaat dus nooit
# naar een server.


# Nog twee geheimen:
#   npx wrangler secret put KOOP_GEHEIM   — deelt de betaalpartner met ons
