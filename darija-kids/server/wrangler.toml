name = "darijaforkids-post"
main = "src/index.ts"

compatibility_date = "2026-09-01"

# Geen tweede adres op `workers.dev`.
#
# Dit stond aan om te kunnen testen terwijl het eigen adres hieronder werd
# aangelegd. Dat adres werkt nu — de koopmail loopt erlangs — en dan is dit
# een openstaande achterdeur: dezelfde worker, openbaar bereikbaar op
# `darijaforkids-post.<subdomein>.workers.dev`, met `/koop`, het portaal en
# `/lezen` erachter.
#
# Op zichzelf geen lek: de CORS-controle kijkt naar `SITE` en `/koop` vraagt nog
# steeds het geheim. Maar elke regel die je later aan het eigen domein hangt —
# een WAF-regel, een snelheidslimiet, een blik op het verkeer — geldt daar niet.
# Dan bewaak je één deur en vergeet je dat de tweede bestaat.
workers_dev = false

# Where the app posts to and where the links in the mails point. Set this to
# the worker's own address once it is deployed.
[vars]
BASIS = "https://post.darijaforkids.eu"
AFZENDER_NAAM = "Darijaforkids"
# Hetzelfde adres als in `src/content/operator.ts`, en dat is geen toeval:
# dit is het adres waarop een koper antwoordt als hij iets kwijt wil. Stond
# hier eerst `post@`, een adres dat alleen deze worker kende. Twee dingen
# gingen daardoor mis: de mailpartner weigert een afzender die niet is
# geverifieerd — elke sleutelmail viel om — en een antwoord van een koper
# kwam in een postbus die niemand leest. `winkel.test.ts` houdt ze gelijk.
AFZENDER_EMAIL = "info@darijaforkids.eu"
# Waar de lezer staat; de sleutel komt achter het hekje en gaat nooit naar een server.
LEZER = "https://darijaforkids.eu/lezen"
# De website zelf. Het portaal woont daar, en het koekje wordt op dit domein
# gezet — niet op dat van deze worker, want de bladzijde vraagt hem op.
SITE = "https://darijaforkids.eu"

# Het eigen adres. `darijaforkids.eu` draait op de nameservers van Cloudflare,
# dus mag wrangler de DNS-regel voor `post.` er zelf bij zetten: deze drie
# regels doen wat anders een rondje door het dashboard is.
#
# Dit staat er niet voor de sier. In elke inlogmail staat een link die met
# BASIS hierboven begint, en die wijst naar `post.darijaforkids.eu`. Zolang dat
# adres niet bestaat, komt niemand binnen.
#
[[routes]]
pattern = "post.darijaforkids.eu"
custom_domain = true

# De database. Eén keer gemaakt met `npm run maak-db`, en het id dat die
# opdracht afdrukt staat hieronder.
#
# Het mag in de repo staan: een database-id is een naam en geen sleutel. Wie
# hem heeft kan er niets mee zonder de toegang tot het account, en de enige
# manier om hem geheim te houden zou zijn dat iedereen die dit uitrolt hem met
# de hand overtypt — precies de stap die mensen vergeten.
#
# Let op: `wrangler d1 create` stelt ook een `binding` voor met de naam van de
# database. Die niet overnemen. De code zoekt `env.DB`, en met een andere
# binding start de worker wel maar valt hij om bij het eerste verzoek.
[[d1_databases]]
binding = "DB"
database_name = "darijaforkids"
database_id = "efdc2224-da27-45cf-974c-36ba1fd95fc0"
# De migraties. Ze staan in server/migrations en wrangler houdt in de tafel
# `d1_migrations` bij welke er al gedraaid hebben, zodat een tweede keer
# toepassen niets doet.
#
# Deze regel hoort hier, bij de binding, en niet bovenaan het bestand. Daar
# stond hij eerst, en wrangler 4.132 antwoordde op elke opdracht met
# "Unexpected fields found in top-level field: migrations_dir" en negeerde hem.
# Het viel niet op omdat de standaardwaarde ook `migrations` is: het werkte,
# maar niet hierdoor. Was deze waarde ooit iets anders geworden, dan had
# wrangler stil in de oude map blijven kijken en was een nieuwe migratie nooit
# toegepast — terwijl de uitrol wél doorging.
migrations_dir = "migrations"

# One run a week. Monday morning, because a week that is reported on Monday is
# a week somebody can still do something about.
[triggers]
crons = ["0 7 * * 1"]

# Two secrets, never in this file:
#   npx wrangler secret put MAIL_SLEUTEL
#   npx wrangler secret put ZOUT

# De bladzijden van de boeken, één object per bladzijde:
#   <reeks>/<deel>/<taal>/<nummer>.webp
# Maak de bak één keer aan met:
#   npx wrangler r2 bucket create darijaforkids-boeken
# en vul hem met `npm run bladen -- --uploaden`.
# Uitgezet tot er bladzijden in gaan.
#
# Het portaal, het inloggen en de ledenlijst hebben deze bak niet nodig — die
# is alleen voor de lezer die een boek bladzijde voor bladzijde uitserveert.
# Een binding naar een bak die niet bestaat laat `wrangler deploy` omvallen,
# en dan gaat er ook niets live dat wél werkt.
#
# De bak bestaat, dus de binding staat aan.
#
# Hij stond hier uitgezet met hekjes ervoor, en `npm run maak-bak` haalde die
# weg — in dit bestand, dat in git zit. Daarmee had iedereen die die opdracht
# ooit had gedraaid een openstaande wijziging die elke `git pull` tegenhield:
#
#   error: Your local changes to the following files would be overwritten
#
# Dat kostte vier ophaalrondes zonder dat iemand doorhad waarom er niets
# veranderde. Een script dat een bestand uit git aanpast, maakt van elke
# volgende samenvoeging een conflict. Dus staat de uitkomst nu gewoon hier.
#
# Bestaat de bak nog niet, dan valt `wrangler deploy` om. Maak hem dan eerst:
#   npm run maak-bak
#
# En daarna, vanuit darija-kids, de boeken erin:
#   npm run lezen -- --r2

[[r2_buckets]]
binding = "BOEKEN"
bucket_name = "darijaforkids-boeken"

# Waar de lezer staat. De sleutel komt achter het hekje en gaat dus nooit
# naar een server.


# Nog twee geheimen:
#   npx wrangler secret put KOOP_GEHEIM   — deelt de betaalpartner met ons
