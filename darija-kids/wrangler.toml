# De website van Darijaforkids, als Worker die alleen bestanden serveert.
#
# Cloudflare stuurt nieuwe projecten tegenwoordig naar Workers in plaats van
# naar Pages, en die weg vraagt om een wrangler.toml. Deze staat met opzet in
# darija-kids en niet in de wortel van de repo: daar staat er al een, van een
# ander project, met een andere naam. Twee projecten die elkaars naam gebruiken
# publiceren over elkaar heen.
#
# Er is geen Worker-script. `assets` zonder `main` betekent: zet deze map neer
# en verder niets. De app is een gewone statische site.
name = "darijaforkids"
compatibility_date = "2026-09-18"

[assets]
directory = "dist"
# /privacy en /leren bestaan niet als bestand — het is één pagina die zelf
# bepaalt wat je ziet. Zonder deze regel geeft de host daar een 404, en precies
# die adressen controleren Apple en Google voordat ze een app aannemen.
not_found_handling = "single-page-application"
