services:
  postgres:
    image: postgres:16-alpine
    container_name: khidma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khidma
      POSTGRES_PASSWORD: khidma
      POSTGRES_DB: khidma
    ports:
      - "5432:5432"
    volumes:
      - khidma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khidma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  khidma-pgdata:
