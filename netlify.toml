# Netlify bouwt de app rechtstreeks uit deze repo.
#
# De app staat in een submap, dus `base` wijst daarheen; alles daarna is
# relatief aan die map.
[build]
  base = "darija-kids"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # De browsers voor de tests horen niet bij een bouw van de website.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Het is één pagina die zelf bepaalt wat je ziet: /privacy en /leren bestaan
# niet als bestand. Zonder deze regel geeft Netlify daar een 404, en juist die
# adressen controleren de winkels.
#
# Dit stond eerder in public/_redirects, maar dat bestand komt mee in dist/ en
# Cloudflare Workers weigert de regel daaruit als een oneindige lus. Elke host
# krijgt de omleiding nu op zijn eigen manier: Netlify hier, Workers via
# not_found_handling in wrangler.toml, Apache via .htaccess.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
