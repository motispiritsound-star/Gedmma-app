# Netlify bouwt de website rechtstreeks uit deze repo.
#
# Wat gepubliceerd wordt is site/ — de etalage — en niet dist/, waar de app
# zelf in staat. De app hoort in de App Store en Google Play, niet op het web.
#
# De app staat in een submap, dus `base` wijst daarheen; alles daarna is
# relatief aan die map.
[build]
  base = "darija-kids"
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
  # De browsers voor de tests horen niet bij een bouw van de website.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Geen omleiding meer van /* naar index.html. Dat hoorde bij de app, die één
# pagina was die zelf uitzocht wat je zag; de website is gewoon een map met
# bestanden, en /privacy is /privacy/index.html. Netlify vindt dat zelf, en
# een adres dat niet bestaat hoort een 404 te zijn — 404.html staat klaar.
